{% extends 'blog/base.html' %}
{% block title %} All Posts {% endblock %}
{% block content %}
    <h1>My First Django App</h1>

    {% for post in posts %}

    <div class="post-card">
        <h2>{{ post.title}}</h2>
        {% if post.cover_image %}
            <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="post-cover">
        {% endif %}
        <p>{{post.body}}</p>
        <p class="post-meta">By <strong>{{post.author}}</strong> - {{post.created_at}}</p>
        
    </div>
    {% endfor%}
{% endblock %}
